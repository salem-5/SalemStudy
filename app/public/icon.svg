    <radialGradient id="tile" cx="0.5" cy="0.3" r="0.95">
      <stop offset="0" stop-color="#15181b"/>
      <stop offset="1" stop-color="#0b0d0f"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="108" fill="url(#tile)"/>
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#8fb3d1" stroke-opacity="0.2" stroke-width="4"/>
  <g transform="translate(256 256) scale(0.66) translate(-512 -512)">
    <g fill="none" stroke="#d7dce0" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
