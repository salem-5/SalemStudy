[package]
name = "webassign-desk"
version = "0.1.0"
description = "Desktop client for WebAssign through the local bridge"
edition = "2021"

[lib]
name = "webassign_desk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
base64 = "0.22"
axum = "0.8"
tokio = { version = "1", features = ["net", "sync", "time", "rt"] }

[dev-dependencies]
# `mock_app` gives the export tests an AppHandle without a window.
tauri = { version = "2", features = ["test"] }
